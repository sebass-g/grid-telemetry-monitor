version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: grid-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: password123

  redis:
    image: redis:7-alpine
    container_name: grid-redis
    ports:
      - "6379:6379"
